name: Language cards

on:
  schedule:
    - cron: "23 0 * * *" # every day at 00:23 UTC
  workflow_dispatch:
  push:
    paths-ignore:
      - "profile/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Weight by bytes and by number of repos so one big repo can't dominate.
  # Game-jam repos are team projects, and markup/shader languages are noise for this card.
  CARD_OPTIONS: >-
    layout=compact&langs_count=8&card_width=420&border_radius=10&custom_title=Most%20Used%20Languages&size_weight=0.5&count_weight=0.5&exclude_repo=Connect,GNGjam&hide=html,css,scss,shaderlab,hlsl,rich%20text%20format

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Most used languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.CARD_OPTIONS }}&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9&border_color=30363d
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Most used languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.CARD_OPTIONS }}&bg_color=ffffff&title_color=0969da&text_color=1f2328&border_color=d0d7de
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "chore: update language cards"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
