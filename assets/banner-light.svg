<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Buğra Yıldırım — Backend Developer</title>
  <desc id="desc">Backend developer working with ASP.NET Core and FastAPI, LLM &amp; RAG systems, computer vision and mobile apps.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d0d7de"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#54aeff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#54aeff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="298" rx="16"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; }
      .p { fill: #1f2328; } .kw { fill: #cf222e; } .typ { fill: #8250df; }
      .prop { fill: #0550ae; } .str { fill: #0a3069; } .var { fill: #953800; }
      .cursor { fill: #0969da; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { fill-opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#ffffff"/>
    <rect width="1200" height="300" fill="url(#dots)" opacity="0.55"/>
    <ellipse cx="900" cy="150" rx="420" ry="230" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <g class="sans">
    <text x="64" y="98" font-size="22" fill="#59636e">Hi, I'm</text>
    <text x="64" y="154" font-size="54" font-weight="700" fill="#1f2328">Buğra Yıldırım</text>
    <text x="64" y="200" font-size="30" font-weight="600" fill="#0969da">Backend Developer</text>
  </g>
  <text x="64" y="240" class="mono" font-size="16" fill="#59636e" xml:space="preserve">LLM &amp; RAG  ·  Computer Vision  ·  Mobile</text>

  <g>
    <rect x="652" y="40" width="500" height="222" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <path d="M652 52 a12 12 0 0 1 12 -12 h476 a12 12 0 0 1 12 12 v26 h-500 z" fill="#eaeef2"/>
    <line x1="652" y1="78" x2="1152" y2="78" stroke="#d0d7de"/>
    <circle cx="676" cy="59" r="6" fill="#ff5f57"/>
    <circle cx="696" cy="59" r="6" fill="#febc2e"/>
    <circle cx="716" cy="59" r="6" fill="#28c840"/>
    <text x="902" y="64" class="mono" font-size="13" fill="#59636e" text-anchor="middle">Developer.cs</text>
  </g>
  <g class="mono">
    <text x="676" y="110" xml:space="preserve"><tspan class="kw">var </tspan><tspan class="var">bugra</tspan><tspan class="p"> = </tspan><tspan class="kw">new </tspan><tspan class="typ">Developer</tspan></text>
    <text x="676" y="132" xml:space="preserve"><tspan class="p">{</tspan></text>
    <text x="676" y="154" xml:space="preserve"><tspan class="p">    </tspan><tspan class="prop">Role</tspan><tspan class="p">    = </tspan><tspan class="str">"Backend Developer"</tspan><tspan class="p">,</tspan></text>
    <text x="676" y="176" xml:space="preserve"><tspan class="p">    </tspan><tspan class="prop">Backend</tspan><tspan class="p"> = </tspan><tspan class="p">[</tspan><tspan class="str">"ASP.NET Core"</tspan><tspan class="p">, </tspan><tspan class="str">"FastAPI"</tspan><tspan class="p">],</tspan></text>
    <text x="676" y="198" xml:space="preserve"><tspan class="p">    </tspan><tspan class="prop">AI</tspan><tspan class="p">      = </tspan><tspan class="p">[</tspan><tspan class="str">"LLM &amp; RAG"</tspan><tspan class="p">, </tspan><tspan class="str">"Computer Vision"</tspan><tspan class="p">],</tspan></text>
    <text x="676" y="220" xml:space="preserve"><tspan class="p">    </tspan><tspan class="prop">Mobile</tspan><tspan class="p">  = </tspan><tspan class="p">[</tspan><tspan class="str">"Flutter"</tspan><tspan class="p">, </tspan><tspan class="str">"Kotlin"</tspan><tspan class="p">],</tspan></text>
    <text x="676" y="242" xml:space="preserve"><tspan class="p">};</tspan><tspan class="cursor"> &#9611;</tspan></text>
